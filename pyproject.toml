[project]
name = "project"
version = "0.1.0"
description = "Evidence-grounded multimodal scientometric indicator extraction"
readme = "README.md"
authors = [
    { name = "zengzizhao", email = "787332942@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openai>=1.0,<3",
    "pydantic>=2.10,<3",
    "markdown-it-py>=3,<5",
    "python-dotenv>=1,<2",
    "langsmith>=0.12,<1",
    "neo4j>=5.26,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
ie = "ie.cli:main"
neo4j-import = "graph_db.neo4j_import:main"
qa-backend = "app.backend.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ie", "src/graph_db", "src/app"]


[tool.hatch.build.targets.wheel.force-exclude]
"src/app/frontend" = true
