# 修改此文件后执行 make run/start/inspect/resume/continue，无需重复传命令行参数。
[run]
# 处理markdown文件路径
input = "data/MinerU_markdown_-index_and_its_variants__a_set_of_overall_scholarly_expertise_diversity_indices_for_the_research_portfolio_management_of_institutions_2098605842830221312.md"
# 输出产物路径
output = "outputs"
# 运行模式
action = "run"
pattern = "*.md"
model = "deepseek-flash"
max_output_tokens = 65536
max_chars = 250000
max_images = 40
max_body_bytes = 40000000
timeout = 600

# checkoutpoint数据库路径
db = ".debug/checkpoints.sqlite"
# 每个checkoutpint的id
thread_id = "paper-001"
# make replay：从最近一个等待执行此节点的历史检查点重跑。
replay_node = "extract_pi_relation"
# resume 遵循前/后暂停点；continue 忽略全部暂停点，但仍逐章保存。
# 不在 discover_chunks 后暂停，全部章节处理完后停在 merge_indicators 前。
stop_after = ["prepare_document", "classify_images", "plan_chunks", "merge_indicators", "extract_pi_relation"]
stop_before = ["merge_indicators"]
# inspect：all/raw_content/images/chunks/skipped_sections/chunk_discoveries/discovery/merge_map/paper_relations/indicator_relations/extraction
field = "all"
